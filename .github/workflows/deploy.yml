name: Deploy to GKE Autopilot

# El pipeline se ejecutará automáticamente cada vez que hagas un 'git push' a la rama 'main'
on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  
  # 👇 REVISA Y ACTUALIZA ESTAS 3 LÍNEAS CON TUS DATOS 👇
  GAR_LOCATION: us-central1                   # La región de tu Artifact Registry
  REPOSITORY: jupyterhub-images               # El nombre de tu repositorio en Artifact Registry
  GKE_CLUSTER: jupyterhub-cluster             # El nombre de tu clúster de GKE
  
  GKE_ZONE: us-central1                       # La región de tu clúster
  DEPLOYMENT_NAME: api-simulacion             # El nombre de tu deployment en Kubernetes
  NAMESPACE: simulador-estocastico            # El namespace donde desplegamos la API
  IMAGE: api-mlops                            # El nombre que le daremos a la imagen Docker

jobs:
  setup-build-deploy:
    name: Setup, Build, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Autenticación en Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Configurar SDK de Google Cloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configurar Docker para Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Construir y Subir Imagen Docker
      run: |
        # Construimos la imagen etiquetándola con el ID único del commit (github.sha)
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} .
        # Subimos la imagen a GCP
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}

    - name: Obtener Credenciales de GKE
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    - name: Desplegar en GKE
      run: |
        # Le decimos a Kubernetes que actualice los pods con la nueva imagen que acabamos de subir
        kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.DEPLOYMENT_NAME }}=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} -n ${{ env.NAMESPACE }}
        
        # Verificamos que el despliegue haya sido exitoso
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
