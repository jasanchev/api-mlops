name: Entrega Continua Docker (CI/CD)

on:
  push:
    branches: [ "main" ]

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Descargar el codigo del repositorio
      uses: actions/checkout@v4

    - name: Iniciar sesion en GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Construir la imagen de Docker
      run: |
        REPO=\((echo "\){{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        docker build -t ghcr.io/$REPO/mi-api-mlops:latest .

    - name: Subir la imagen al Registry
      run: |
        REPO=\((echo "\){{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        docker push ghcr.io/$REPO/mi-api-mlops:latest
